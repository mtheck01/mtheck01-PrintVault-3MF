name: PrintVault Autonomous Cycle

on:
  push:
    branches: [main]
  schedule:
    # Safety poll for API-created commits that do not emit push workflow events.
    # Push events remain the primary trigger; this poll is only a backstop.
    - cron: "*/15 * * * *"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      max_attempts:
        description: "Maximum build/test/repair attempts"
        required: true
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      auto_repair:
        description: "Allow the repair agent to generate and test the next patch"
        required: true
        default: true
        type: boolean
      publish_on_pass:
        description: "Publish and promote the first candidate that passes all gates"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  statuses: write
  issues: write

concurrency:
  # Exactly one cycle may run and at most one pending cycle may wait.
  # A scheduled poll is a safety net, not a backlog generator. Never cancel the
  # active engineering cycle, but replace obsolete pending polls with the newest one.
  group: printvault-autonomous-cycle
  queue: single
  cancel-in-progress: false

jobs:
  cycle:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    name: Build Install Run Test Repair Repeat
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Validate repository identity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REPOSITORY -ne "mtheck01/mtheck01-PrintVault-3MF") {
            throw "Repository identity mismatch: GITHUB_REPOSITORY=$env:GITHUB_REPOSITORY"
          }
          python ".\tools\test_repository_identity.py"

      - name: Validate runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) { throw "dotnet is required." }
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) { throw "python is required." }
          Write-Host "RUNNER=$env:RUNNER_NAME"
          dotnet --version
          python --version

      - name: Deterministic autonomous intake preflight
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          for ($pass = 1; $pass -le 2; $pass++) {
            Write-Host "AUTONOMOUS_INTAKE_PREFLIGHT_PASS=$pass/2"
            python ".\tools\test_autonomous_engineering_intake.py"
            if ($LASTEXITCODE -ne 0) {
              throw "Deterministic autonomous intake preflight failed on pass $pass. No OpenAI repair request is permitted."
            }
          }
          Write-Host "AUTONOMOUS_INTAKE_PREFLIGHT=PASS"

      - name: Run autonomous cycle
        shell: powershell
        env:
          RELEASE_TOKEN: ${{ secrets.PrintVaultReleaseAutomation }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REPAIR_MODEL: gpt-5.6-sol
          # Push/schedule validation is explicitly zero-credit: OpenAI repair is
          # available only when a human deliberately starts workflow_dispatch with
          # auto_repair=true.
          MAX_ATTEMPTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_attempts || '1' }}
          AUTO_REPAIR: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_repair || false }}
          PRINTVAULT_ZERO_CREDIT: ${{ github.event_name != 'workflow_dispatch' || inputs.auto_repair == false }}
          PUBLISH_ON_PASS: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_on_pass || true }}
        run: |
          $ErrorActionPreference = "Stop"
          $maxAttempts = [int]$env:MAX_ATTEMPTS
          $autoRepair = $env:AUTO_REPAIR -eq "true"
          $publish = $env:PUBLISH_ON_PASS -eq "true"
          $expectedCatalog = $null
          $baselinePath = Join-Path $PWD "automation/baseline-9.0.44.json"
          $baseline = Get-Content $baselinePath -Raw | ConvertFrom-Json

          if ($publish -and [string]::IsNullOrWhiteSpace($env:RELEASE_TOKEN)) {
            throw "PRINTVAULT_RELEASE_TOKEN is required when publish_on_pass=true."
          }

          $branch = "autonomous/cycle-$env:GITHUB_RUN_ID"
          git config user.name "PrintVault Autonomous Cycle"
          git config user.email "printvault-automation@users.noreply.github.com"
          git fetch origin main --prune
          $startingMainSha = (git rev-parse origin/main).Trim()
          Write-Host "STARTING_MAIN_SHA=$startingMainSha"

          function Write-CycleStatus($stage, $detail = "") {
            $statusDir = Join-Path $PWD "build_logs"
            New-Item -ItemType Directory -Force -Path $statusDir | Out-Null
            $status = [pscustomobject]@{
              TimestampUtc = (Get-Date).ToUniversalTime().ToString("o")
              RunId = $env:GITHUB_RUN_ID
              Attempt = $script:CurrentAttempt
              Stage = $stage
              Detail = $detail
              ProcessId = $PID
            }
            $status | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $statusDir "cycle-status.json")
            Write-Host "CYCLE_RUN_ID=$env:GITHUB_RUN_ID"
            Write-Host "CYCLE_STAGE=$stage DETAIL=$detail"

            # Publish live stage through commit status instead of relying on Actions log blobs.
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN) -and -not [string]::IsNullOrWhiteSpace($env:GITHUB_SHA)) {
              $statusState = if ($stage -eq "DONE") { "success" } elseif ($stage -eq "FAILED") { "failure" } else { "pending" }
              $description = "$stage" + $(if ([string]::IsNullOrWhiteSpace($detail)) { "" } else { ": $detail" })
              if ($description.Length -gt 140) { $description = $description.Substring(0,140) }
              $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2026-03-10"; "User-Agent" = "PrintVault-Autonomous-Cycle" }
              $body = @{ state = $statusState; context = "printvault/autonomous-cycle"; description = $description; target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json
              try {
                Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers $headers -Method Post -Body $body -ContentType "application/json" | Out-Null
                Write-Host "CYCLE_COMMIT_STATUS=$statusState"
              } catch { Write-Warning "Unable to publish cycle commit status: $($_.Exception.Message)" }
            }
          }


          # Scheduled runs exist only to catch commits that were created through
          # an API path that did not emit a push event. A scheduled run must NEVER
          # manufacture a new patch version or release when main is already at the
          # source commit of the latest published release.
          if ($env:GITHUB_EVENT_NAME -eq "schedule") {
            $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2026-03-10"
              "User-Agent" = "PrintVault-Autonomous-Cycle"
            }
            try {
              $latestRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers $headers -Method Get
              $latestReleaseSha = [string]$latestRelease.target_commitish
              Write-Host "SCHEDULE_LATEST_RELEASE=$($latestRelease.tag_name) TARGET=$latestReleaseSha"

              # A published release is NOT proof that the exact current main SHA
              # has passed the engineering validation suite. The scheduled poll may
              # short-circuit only when GitHub has an explicit success status for this
              # exact SHA from the whole-library validation gate.
              $issueQuery = [System.Uri]::EscapeDataString("repo:$env:GITHUB_REPOSITORY is:issue is:open in:title `"[PrintVault-Autonomous]`"")
              $openEngineeringIssues = Invoke-RestMethod -Uri "https://api.github.com/search/issues?q=$issueQuery&per_page=10" -Headers $headers -Method Get
              $engineeringIssueCount = [int]$openEngineeringIssues.total_count
              Write-Host "SCHEDULE_OPEN_ENGINEERING_ISSUES=$engineeringIssueCount"

              $validationStatuses = @()
              try {
                $validationStatuses = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$startingMainSha/statuses?per_page=100" -Headers $headers -Method Get)
              } catch {
                throw "Unable to inspect validation status for exact main SHA $startingMainSha. Refusing to short-circuit: $($_.Exception.Message)"
              }
              $wholeLibraryValidated = @($validationStatuses | Where-Object {
                $_.context -eq "printvault/whole-library-validation" -and
                $_.state -eq "success" -and
                $_.sha -eq $startingMainSha
              }).Count -gt 0
              Write-Host "WHOLE_LIBRARY_VALIDATION_STATUS=$([string]$wholeLibraryValidated.ToString().ToUpperInvariant())"
              Write-Host "WHOLE_LIBRARY_VALIDATION_SHA=$startingMainSha"

              if ($engineeringIssueCount -gt 0) {
                Write-Host "SCHEDULE_VALIDATION_NEEDED=YES_ENGINEERING_ISSUE"
              }
              elseif ($wholeLibraryValidated) {
                Write-Host "SCHEDULE_VALIDATION_NEEDED=NO_EXACT_SHA_ALREADY_VALIDATED"
                Write-CycleStatus "DONE" "scheduled poll: exact main SHA $startingMainSha already has whole-library validation status"
                exit 0
              }
              else {
                # A failed scheduled validation does not change main. Re-running the
                # exact same SHA every 10/15 minutes cannot repair anything in zero-credit
                # mode; it only burns runner time and creates a misleading backlog.
                # Treat a completed prior run for this exact SHA as a terminal scheduled
                # attempt. A human can explicitly retry with workflow_dispatch.
                $encodedSha = [System.Uri]::EscapeDataString($startingMainSha)
                $priorRunsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/autonomous-cycle.yml/runs?head_sha=$encodedSha&per_page=100"
                $priorRuns = @(Invoke-RestMethod -Uri $priorRunsUri -Headers $headers -Method Get)
                $priorCompletedRuns = @($priorRuns.workflow_runs | Where-Object {
                  $_.id -ne [int64]$env:GITHUB_RUN_ID -and
                  $_.status -eq "completed"
                })
                Write-Host "SCHEDULE_PRIOR_COMPLETED_RUNS_FOR_SHA=$($priorCompletedRuns.Count)"
                if ($priorCompletedRuns.Count -gt 0) {
                  $latestPrior = $priorCompletedRuns | Sort-Object -Property updated_at -Descending | Select-Object -First 1
                  Write-Host "SCHEDULE_VALIDATION_NEEDED=NO_EXACT_SHA_ALREADY_ATTEMPTED"
                  Write-Host "SCHEDULE_PRIOR_RUN=$($latestPrior.run_number) CONCLUSION=$($latestPrior.conclusion) UPDATED=$($latestPrior.updated_at)"
                  Write-CycleStatus "SKIPPED" "scheduled poll: exact main SHA $startingMainSha already has completed autonomous run #$($latestPrior.run_number); explicit dispatch required to retry"
                  exit 0
                }
                Write-Host "SCHEDULE_VALIDATION_NEEDED=YES_EXACT_SHA_NOT_VALIDATED"
              }
            } catch {
              throw "Unable to resolve latest published release during scheduled validation. Refusing to manufacture a release: $($_.Exception.Message)"
            }
          }

          git switch -c $branch

          # Human engineering requests are durable GitHub issues. The runner claims
          # one open [PrintVault-Autonomous] issue, generates a validated source
          # patch, and then sends that patch through the exact same build/test/
          # repair/whole-library/publish gates below. If no request exists, the
          # normal scheduled validation cycle continues unchanged.
          function Publish-SourceRelease($version, $sourceSha, $installerPath) {
            $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2026-03-10"
              "User-Agent" = "PrintVault-Autonomous-Cycle"
            }
            $repo = $env:GITHUB_REPOSITORY
            $tag = "v$version"
            $releaseApi = "https://api.github.com/repos/$repo/releases/tags/$tag"
            $release = $null
            try {
              $release = Invoke-RestMethod -Uri $releaseApi -Headers $headers -Method Get
            } catch {
              $response = $_.Exception.Response
              $status = if ($null -ne $response) { [int]$response.StatusCode } else { 0 }
              if ($status -ne 404) { throw }
            }

            if ($null -eq $release) {
              $releaseBody = @{
                tag_name = $tag
                target_commitish = $sourceSha
                name = "PrintVault 3MF v$version"
                body = "Automated validated release. Source commit: $sourceSha. Whole-library validation: $expectedCatalog processed, 0 conflicts, 0 failures."
                draft = $false
                prerelease = $false
              } | ConvertTo-Json -Depth 5
              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Headers $headers -Method Post -Body $releaseBody -ContentType "application/json"
              Write-Host "SOURCE_RELEASE_CREATED=PASS"
            } else {
              Write-Host "SOURCE_RELEASE_EXISTS=PASS ID=$($release.id)"
            }

            $assetName = [System.IO.Path]::GetFileName($installerPath)
            $asset = @($release.assets | Where-Object { $_.name -eq $assetName })
            if ($asset.Count -eq 0) {
              $encodedName = [System.Uri]::EscapeDataString($assetName)
              $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encodedName"
              Invoke-RestMethod -Uri $uploadUrl -Headers $headers -Method Post -InFile $installerPath -ContentType "application/octet-stream" | Out-Null
              Write-Host "SOURCE_RELEASE_ASSET=PASS"
            } else {
              Write-Host "SOURCE_RELEASE_ASSET_EXISTS=PASS"
            }

            $verify = Invoke-RestMethod -Uri $releaseApi -Headers $headers -Method Get
            if ($verify.tag_name -ne $tag) { throw "Source release tag verification failed." }
            $verifiedAsset = @($verify.assets | Where-Object { $_.name -eq $assetName })
            if ($verifiedAsset.Count -ne 1) { throw "Source release installer asset verification failed." }
            Write-Host "SOURCE_RELEASE_VERIFICATION=PASS"
            Write-Host "SOURCE_RELEASE_URL=$($verify.html_url)"
          }

          function Publish-WholeLibraryValidationStatus($sourceSha, $detail) {
            $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2026-03-10"
              "User-Agent" = "PrintVault-Autonomous-Cycle"
            }
            $body = @{
              state = "success"
              context = "printvault/whole-library-validation"
              description = $detail
              target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$sourceSha" -Headers $headers -Method Post -Body $body -ContentType "application/json" | Out-Null
            Write-Host "WHOLE_LIBRARY_VALIDATION_STATUS=PASS SHA=$sourceSha"
          }

          function Get-Version {
            return (Get-Content ".\VERSION" -Raw).Trim()
          }

          function Invoke-ExternalWithHeartbeat($filePath, [string[]]$arguments, $logPath, $timeoutSeconds = 300) {
            $errPath = "$logPath.err"
            Remove-Item $logPath,$errPath -Force -ErrorAction SilentlyContinue
            Write-Host "EXTERNAL_START=$filePath"

            # Use System.Diagnostics.Process directly. Start-Process on this
            # self-hosted PowerShell runner has intermittently produced a Process
            # wrapper whose ExitCode is unavailable after the child exits, which
            # falsely aborts a successful automation run. Process.WaitForExit()
            # gives us the actual OS exit code deterministically.
            $argumentString = ($arguments | ForEach-Object {
              $arg = [string]$_
              # Quote any argument containing whitespace or shell-sensitive characters.
              # The previous regex used a double backslash and failed to match ordinary spaces,
              # which broke paths such as D:\\3d print files when crossing the process boundary.
              if ($arg -match '\s' -or $arg -match '[&|;<>]') {
                '"' + $arg.Replace('"','\"') + '"'
              } else {
                $arg
              }
            }) -join ' '
            Write-Host "EXTERNAL_ARGUMENTS=$argumentString"

            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $filePath
            $psi.Arguments = $argumentString
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true

            $proc = New-Object System.Diagnostics.Process
            $proc.StartInfo = $psi
            if (-not $proc.Start()) { throw "Unable to start external process: $filePath" }

            $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
            $stderrTask = $proc.StandardError.ReadToEndAsync()
            $started = Get-Date
            while (-not $proc.HasExited) {
              Start-Sleep -Seconds 15
              $elapsed = [int]((Get-Date) - $started).TotalSeconds
              Write-Host "EXTERNAL_HEARTBEAT=$filePath ELAPSED_SECONDS=$elapsed PID=$($proc.Id)"
              Write-CycleStatus "EXTERNAL_RUNNING" "$filePath elapsed=$elapsed"
              if ($elapsed -ge $timeoutSeconds) {
                Write-Warning "EXTERNAL_TIMEOUT=$filePath PID=$($proc.Id) elapsed=$elapsed; terminating process tree."
                try { $proc.Kill() } catch {}
                try { $proc.WaitForExit(10000) | Out-Null } catch {}
                try { & taskkill.exe /PID $proc.Id /T /F 2>&1 | ForEach-Object { Write-Host "EXTERNAL_KILL=$_"} } catch { Write-Warning "Process-tree termination failed: $($_.Exception.Message)" }
                throw "External process timed out after $timeoutSeconds seconds: $filePath (process tree terminated)"
              }
            }

            $proc.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            Set-Content -Path $logPath -Value $stdout -NoNewline -Encoding UTF8
            Set-Content -Path $errPath -Value $stderr -NoNewline -Encoding UTF8

            $exitCode = [int]$proc.ExitCode
            if (Test-Path $logPath) { Get-Content $logPath | ForEach-Object { Write-Host $_ } }
            if (Test-Path $errPath) { Get-Content $errPath | ForEach-Object { Write-Host $_ } }
            Write-Host "EXTERNAL_EXIT=$exitCode FILE=$filePath"
            $proc.Dispose()
            return $exitCode
          }

          Write-CycleStatus "FORENSIC_AUDIT" "repository-wide deterministic inventory before engineering intake"
          for ($auditPass = 1; $auditPass -le 2; $auditPass++) {
            Write-Host "FORENSIC_AUDIT_PASS=$auditPass/2"
            python ".\tools\forensic_repository_audit.py"
            if ($LASTEXITCODE -ne 0) {
              throw "Forensic repository audit failed before engineering intake on pass $auditPass."
            }
          }
          Write-Host "FORENSIC_AUDIT_PRE_INTAKE=PASS"

          Write-CycleStatus "ENGINEERING_INTAKE" "checking for open autonomous engineering request"
          # Zero-credit intake must fail fast if the runner cannot complete the GitHub-only issue check.
          # It must never occupy the cycle for the full build timeout while no model call is permitted.
          $engineeringExit = Invoke-ExternalWithHeartbeat "python" @(".\tools\autonomous_engineering.py") (Join-Path $PWD "build_logs\autonomous-engineering.log") 120
          if ($engineeringExit -ne 0) {
            throw "Autonomous engineering intake failed with exit code $engineeringExit."
          }
          $engineeringJobPath = Join-Path $PWD "build_logs\autonomous-engineering-job.json"
          if (Test-Path $engineeringJobPath) {
            $engineeringJob = Get-Content $engineeringJobPath -Raw | ConvertFrom-Json
            Write-Host "ENGINEERING_ISSUE_NUMBER=$($engineeringJob.issue)"
            Write-Host "ENGINEERING_HANDOFF=PASS"
          }
          else {
            Write-Host "ENGINEERING_JOB=NONE"
          }


          function Find-TestLibraryRoot {
            # The autonomous test harness is allowed to touch ONLY the dedicated
            # isolated test library. Never discover or scan the production library.
            Write-Host "PRODUCTION_LIBRARY_SCAN=DISABLED"
            Write-Host "DRIVE_ROOT_SCAN=DISABLED"
            $testRoot = "D:\3d print files test"
            $resolvedConfigured = if (-not [string]::IsNullOrWhiteSpace($env:PRINTVAULT_TEST_LIBRARY_ROOT)) {
              $env:PRINTVAULT_TEST_LIBRARY_ROOT.TrimEnd("\")
            } else {
              $testRoot
            }

            $normalized = $resolvedConfigured.TrimEnd("\")
            if ($normalized -ne $testRoot) {
              throw "Refusing to scan unapproved test-library path: $normalized. Expected exactly: $testRoot"
            }
            # Use literal comparisons only. Regex is unnecessary here and can
            # interpret the \\3 sequence as a regex backreference on PowerShell.
            if ($normalized -eq "D:\\3d" -or $normalized -eq "D:\\3d\\") {
              throw "Refusing to scan production D:\\3d library path: $normalized"
            }
            if ($normalized.Length -eq 3 -and $normalized[1] -eq ':' -and $normalized[2] -eq '\\') {
              throw "Refusing to scan a drive root: $normalized"
            }
            if ($normalized -eq "D:\3d print files") {
              throw "Refusing to scan production library directory: $normalized"
            }
            if (-not (Test-Path -LiteralPath $normalized -PathType Container)) {
              throw "Dedicated PrintVault test library folder not found: $normalized"
            }

            $files = @(Get-ChildItem -LiteralPath $normalized -Filter "*.3mf" -File -Recurse -ErrorAction Stop)
            if ($files.Count -eq 0) {
              throw "Dedicated PrintVault test library folder contains no .3mf files: $normalized"
            }

            $resolved = (Resolve-Path -LiteralPath $normalized).Path.TrimEnd("\")
            Write-Host "TEST_LIBRARY_ROOT=$resolved"
            Write-Host "TEST_LIBRARY_FILES=$($files.Count)"
            return $resolved
          }
          function Bump-PatchVersion {
            $v = [version](Get-Version)
            $next = "$($v.Major).$($v.Minor).$($v.Build + 1)"
            Set-Content ".\VERSION" $next -NoNewline
            Write-Host "CANDIDATE_VERSION=$next"
            return $next
          }

          function Get-SourceFingerprint {
            $head = (git rev-parse HEAD).Trim()
            # Include tracked working-tree diffs AND untracked source/configuration files.
            # Generated build_logs/dist output is excluded because it is recreated by the
            # cycle itself; VERSION is intentionally excluded because candidate versioning
            # is controlled separately by Bump-PatchVersion.
            $diff = git diff --binary HEAD -- . ':(exclude)build_logs' ':(exclude)dist' ':(exclude)VERSION'
            $status = git status --porcelain=v1 -z -- . ':(exclude)build_logs' ':(exclude)dist' ':(exclude)VERSION'
            $untracked = @()
            $statusParts = $status -split [char]0
            foreach ($entry in $statusParts) {
              if ([string]::IsNullOrWhiteSpace($entry)) { continue }
              $pathText = if ($entry.Length -gt 3) { $entry.Substring(3) } else { "" }
              if ([string]::IsNullOrWhiteSpace($pathText)) { continue }
              if ($entry.Substring(0,2) -match "[?AMDRCU]") {
                $candidate = $pathText.Trim('"')
                if (Test-Path $candidate -PathType Leaf) {
                  $untracked += $candidate + [Environment]::NewLine + (Get-FileHash $candidate -Algorithm SHA256).Hash
                }
              }
            }
            $payload = $head + [Environment]::NewLine + $diff + [Environment]::NewLine + ($untracked -join [Environment]::NewLine)
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
            $hash = [System.Security.Cryptography.SHA256]::Create()
            try { return ([System.BitConverter]::ToString($hash.ComputeHash($bytes))).Replace("-", "").ToLowerInvariant() }
            finally { $hash.Dispose() }
          }

          function Invoke-SourceTests {
            $tests = @(
              "test_release_preflight_contract.py",
              "test_autonomous_cycle_contract.py",
              "test_source_integrity.py",
              "test_language_detection_challenge.py",
              "test_challenge_version_consistency.py",
              "test_xaml_cs_integrity.py",
              "test_ui_features.py",
              "test_ui_navigation.py",
              "test_scan_modes.py",
              "test_scan_progress.py",
              "test_semantic_evidence_large_scale_fix_9_0_38.py",
              "test_semantic_evidence_large_scale_fix_9_0_39.py",
              "test_semantic_evidence_large_scale_fix_9_0_40.py",
              "test_semantic_evidence_arbitration_9_0_42.py",
              "test_semantic_evidence_architecture_9_0_43.py",
              "test_semantic_evidence_dimensional_arbitration_9_0_44.py",
              "test_semantic_evidence_artifact_role_precision_9_0_45.py",
              "test_semantic_evidence_unresolved_category_gate_9_0_46.py",
              "test_8_6_library_lifecycle.py",
              "test_browse_sorting.py",
              "test_category_dropdown_fix3.py",
              "test_category_navigation_fix2.py",
              "test_category_reconciliation.py",
              "test_change_category_readability.py",
              "test_clear_scan_race.py",
              "test_consolidation_deep.py",
              "test_full_library_intelligence_9_0_11.py",
              "test_intelligence_8_4.py",
              "test_language_intelligence_module.py",
              "test_library_intelligence_health.py",
              "test_scan_stability.py",
              "test_schema_migration.py",
              "test_semantic_evidence_fusion_9_0_13.py",
              "test_semantic_evidence_taxonomy_contract_9_0_24.py",
              "test_semantic_intelligence.py",
              "test_semantic_relationship_integration_9_0_20.py",
              "test_smart_category_engine.py",
              "test_smart_category_review.py",
              "test_whole_library_entity_coverage_v1.py",
              "test_autonomous_engineering_intake.py"
            )
            $failurePath = Join-Path $PWD "build_logs\\source-test-failures.json"
            $lockPath = Join-Path $PWD "build_logs\\module-locks.json"
            New-Item -ItemType Directory -Force -Path (Split-Path $failurePath) | Out-Null
            $failures = @()
            $locks = @()
            $fingerprintBefore = Get-SourceFingerprint

            # Every module is independently exercised twice. A module is not locked
            # until both passes succeed against the exact same source fingerprint.
            for ($pass = 1; $pass -le 2; $pass++) {
              Write-Host "MODULE_PASS=$pass/2"
              foreach ($test in $tests) {
                $moduleName = [System.IO.Path]::GetFileNameWithoutExtension($test)
                Write-Host "SOURCE_TEST_START=$test PASS=$pass"
                $testLog = Join-Path $PWD ("build_logs\\source-test-" + $moduleName + "-pass" + $pass + ".log")
                $exit = Invoke-ExternalWithHeartbeat "python" @(".\\tools\\$test") $testLog 300
                if (Test-Path $testLog) {
                  Get-Content $testLog | ForEach-Object { Write-Host $_ }
                }
                if ($exit -ne 0) {
                  Write-Host "SOURCE_TEST_FAILURE=$test PASS=$pass EXIT=$exit"
                  $diagnostics = if (Test-Path $testLog) { (Get-Content $testLog -Raw) } else { "" }
                  if ($diagnostics.Length -gt 12000) {
                    $diagnostics = $diagnostics.Substring($diagnostics.Length - 12000)
                  }
                  $failures += [pscustomobject]@{
                    Test=$test
                    Pass=$pass
                    ExitCode=$exit
                    LogPath=$testLog
                    Diagnostics=$diagnostics
                  }
                } else {
                  Write-Host "SOURCE_TEST_PASS=$test PASS=$pass"
                }
              }
            }

            $fingerprintAfter = Get-SourceFingerprint
            if ($fingerprintAfter -ne $fingerprintBefore) {
              throw "Source changed while module tests were running. Refusing to create module locks."
            }

            if ($failures.Count -eq 0) {
              foreach ($test in $tests) {
                $locks += [pscustomobject]@{
                  Module=[System.IO.Path]::GetFileNameWithoutExtension($test)
                  Test=$test
                  Passes=2
                  Fingerprint=$fingerprintAfter
                  LockedUtc=(Get-Date).ToUniversalTime().ToString("o")
                }
              }
              ConvertTo-Json -InputObject @($locks) -Depth 5 | Set-Content -Path $lockPath -Encoding UTF8
              Write-Host "MODULE_LOCKS=CREATED COUNT=$($locks.Count) PASSES=2 FINGERPRINT=$fingerprintAfter"
            } else {
              Remove-Item $lockPath -Force -ErrorAction SilentlyContinue
              Write-Host "MODULE_LOCKS=NOT_CREATED FAILURES=$($failures.Count)"
            }

            ConvertTo-Json -InputObject @($failures) -Depth 5 | Set-Content -Path $failurePath -Encoding UTF8
            $script:SourceTestFailures = @($failures)
            $script:SourceModuleLocks = @($locks)
            $script:SourceModuleCount = $tests.Count
            $script:SourceFingerprint = $fingerprintAfter
            Write-Host "SOURCE_TEST_FAILURE_COUNT=$($script:SourceTestFailures.Count)"
            Write-Host "SOURCE_MODULE_LOCK_COUNT=$($script:SourceModuleLocks.Count)"

            # FAIL CLOSED: required source/semantic tests are a hard gate.
            # Previously failures were recorded for diagnostics but execution
            # continued, allowing a false-green Autonomous Cycle.
            if ($script:SourceTestFailures.Count -ne 0) {
              $failedNames = ($script:SourceTestFailures | ForEach-Object { "$($_.Test) [pass=$($_.Pass) exit=$($_.ExitCode)]" }) -join "; "
              throw "SOURCE_TEST_GATE_FAILED: $($script:SourceTestFailures.Count) required module test failure(s): $failedNames"
            }
            if ($script:SourceModuleLocks.Count -ne $script:SourceModuleCount) {
              throw "SOURCE_MODULE_LOCK_GATE_FAILED: expected $($script:SourceModuleCount) module locks after two-pass validation, found $($script:SourceModuleLocks.Count)."
            }
            Write-Host "SOURCE_TEST_GATE=PASS"
            Write-Host "SOURCE_MODULE_LOCK_GATE=PASS"
          }

          function Invoke-CandidateBuild {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\tools\release_preflight.ps1" -Root "$PWD"
            python ".\tools\static_audit.py"
            python ".\tools\forensic_repository_audit.py"
            if ($LASTEXITCODE -ne 0) { throw "Forensic repository audit failed after candidate source changes." }
            Invoke-SourceTests
            python ".\tools\forensic_repository_audit.py"
            if ($LASTEXITCODE -ne 0) { throw "Forensic repository audit failed after module verification." }
            $candidateBuildLog = Join-Path $PWD "build_logs\\candidate-build.log"
            New-Item -ItemType Directory -Force -Path (Split-Path $candidateBuildLog) | Out-Null
            Write-Host "CANDIDATE_BUILD_LOG=$candidateBuildLog"
            # build_windows.bat contains an interactive pause for local builds.
            # Autonomous CI must explicitly select its non-interactive path.
            $env:PRINTVAULT_CI = "1"
            Write-Host "PRINTVAULT_CI=$env:PRINTVAULT_CI"
            $env:PRINTVAULT_AUTONOMOUS_CLASSIFICATION_ONLY = "1"
            Write-Host "PRINTVAULT_AUTONOMOUS_CLASSIFICATION_ONLY=$env:PRINTVAULT_AUTONOMOUS_CLASSIFICATION_ONLY"
            cmd /c "build_windows.bat" > $candidateBuildLog 2>&1
            $buildExit = $LASTEXITCODE
            if (Test-Path $candidateBuildLog) {
              Get-Content $candidateBuildLog | ForEach-Object { Write-Host $_ }
            }
            Write-Host "CANDIDATE_BUILD_EXIT=$buildExit"
            if ($buildExit -ne 0) { throw "build_windows.bat failed with exit code $buildExit. See build_logs\\candidate-build.log." }

            $version = Get-Version
            $installer = Join-Path $PWD ("dist\installer\PrintVault_3MF_v" + $version + "_Setup.exe")
            $exe = Join-Path $PWD "dist\PrintVault\PrintVault.exe"
            if (-not (Test-Path $installer)) { throw "Installer missing: $installer" }
            if (-not (Test-Path $exe)) { throw "Application missing: $exe" }
            return @{ Version=$version; Installer=$installer; Exe=$exe }
          }

          function Install-Candidate($candidate) {
            Get-Process "PrintVault" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            $p = Start-Process -FilePath $candidate.Installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -PassThru
            if (-not $p.WaitForExit(120000)) {
              try { $p.Kill($true) } catch {}
              throw "Installer timed out after 120 seconds."
            }
            if ($p.ExitCode -ne 0) { throw "Installer exited with code $($p.ExitCode)." }
            $installed = "C:\Program Files\PrintVault 3MF\PrintVault.exe"
            if (-not (Test-Path $installed)) { throw "Installed executable missing: $installed" }
            $fv = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installed).FileVersion
            if ($fv -ne $candidate.Version) { throw "Installed version mismatch. Expected $($candidate.Version), found $fv." }
            Write-Host "APPLICATION=INSTALLED VERSION=$fv"
            return @{ Path=$installed; Version=$fv; Installer=$candidate.Installer }
          }

          function Start-FinalApp($candidate, $libraryRoot) {
            Get-Process "PrintVault" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $rootFile = Join-Path $env:APPDATA "PrintVault\root.txt"
            New-Item -ItemType Directory -Force -Path (Split-Path $rootFile) | Out-Null
            Set-Content -Path $rootFile -Value $libraryRoot -NoNewline

            $proc = Start-Process -FilePath $candidate.Path -PassThru
            Start-Sleep -Seconds 30
            if ($proc.HasExited) { throw "Final PrintVault smoke launch exited with code $($proc.ExitCode)." }
            Write-Host "APPLICATION=OPEN VERSION=$($candidate.Version) PID=$($proc.Id) MAIN_WINDOW=$($proc.MainWindowHandle)"
            Write-Host "APPLICATION=OPEN_READY=PASS"
            return $proc
          }

          function Close-PrintVault($app) {
            if ($null -ne $app -and $null -ne $app.Process -and -not $app.Process.HasExited) { $app.Process | Stop-Process -Force -ErrorAction SilentlyContinue }
            Get-Process "PrintVault" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Host "APPLICATION=CLOSED"
          }

          function Invoke-WholeLibrary {
            param([int]$Pass = 1)
            Write-CycleStatus "WHOLE_LIBRARY_START" "pass=$Pass"
            $reportDir = Join-Path $env:APPDATA "PrintVault\reports"
            New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
            $artifactDir = Join-Path $PWD "build_logs\reports"
            New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

            $restoreLog = Join-Path $PWD "build_logs\automation-restore.log"
            $buildLog = Join-Path $PWD "build_logs\automation-build.log"
            $runLog = Join-Path $PWD "build_logs\automation-run.log"

            Write-Host "WHOLE_LIBRARY=RESTORE"
            $restoreExit = Invoke-ExternalWithHeartbeat "dotnet" @("restore", ".\tools\PrintVault.Automation\PrintVault.Automation.csproj") $restoreLog 600
            if ($restoreExit -ne 0) { throw "Whole-library automation restore failed with exit code $restoreExit." }

            Write-Host "WHOLE_LIBRARY=BUILD"
            $buildExit = Invoke-ExternalWithHeartbeat "dotnet" @("build", ".\tools\PrintVault.Automation\PrintVault.Automation.csproj", "-c", "Release", "--no-restore") $buildLog 900
            if ($buildExit -ne 0) { throw "Whole-library automation build failed with exit code $buildExit." }

            Write-Host "WHOLE_LIBRARY=RUN"
            Write-CycleStatus "WHOLE_LIBRARY_RUN" "rootcause pass=$Pass"
            $runExit = Invoke-ExternalWithHeartbeat "dotnet" @("run", "--project", ".\tools\PrintVault.Automation\PrintVault.Automation.csproj", "-c", "Release", "--no-build", "--", "rootcause", $reportDir, "$expectedCatalog") $runLog 900
            if ($runExit -ne 0) { throw "Whole-library runner failed with exit code $runExit." }

            $json = Get-ChildItem $reportDir -Filter "whole-library-root-cause.*.json" |
              Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
            if (-not $json) { throw "No whole-library JSON report found in $reportDir." }

            Get-ChildItem $reportDir -Filter "whole-library-root-cause.*.*" |
              Copy-Item -Destination $artifactDir -Force

            Write-Host "WHOLE_LIBRARY_REPORT=$($json.FullName)"
            return $json.FullName
          }

          function Get-ActionableConflictCount($r) {
            $builtIn = @("Functional","Terrain & Props","Figures & Characters","Vehicles","Household","Tools & Workshop","Toys & Games","Art & Decor","HueForge","Keychains","Buildings","Nature & Scenery","Tabletop Terrain","Props & Accessories","Uncategorized","Unknown")
            $count = 0
            foreach ($row in $r.rows) {
              $stored = [string]$row.StoredCategory
              $inferred = [string]$row.InferredCategory
              if ([string]::IsNullOrWhiteSpace($inferred) -or $inferred -in @("Uncategorized","Unknown")) { continue }
              $confidence = [int]$row.ClassificationConfidence
              $evidence = [int]$row.EvidenceQuality
              $basis = [string]$row.Basis
              $evidenceText = [string]$row.Evidence
              $disposition = [string]$row.Disposition
              $storedIsBuiltIn = $stored -in $builtIn
              $strongUnresolvedLexical = ($stored -in @("","Uncategorized","Unknown")) -and $basis.StartsWith("Lexical evidence:",[System.StringComparison]::OrdinalIgnoreCase) -and $confidence -ge 60 -and $evidenceText.IndexOf("Lexical cue:",[System.StringComparison]::OrdinalIgnoreCase) -ge 0
              $highConfidenceResolution = $disposition -eq "RESOLUTION_CANDIDATE" -and $confidence -ge 85 -and $evidence -ge 75
              if (-not $storedIsBuiltIn -and -not $highConfidenceResolution) { continue }
              $unresolvedFunctionalCandidate = ($stored -in @("","Uncategorized","Unknown")) -and $inferred -eq "Functional" -and $confidence -ge 85 -and $evidence -ge 25
              $unresolvedRoleCandidate = ($stored -in @("","Uncategorized","Unknown")) -and $confidence -ge 85 -and $evidence -ge 25 -and (
                $basis.IndexOf("Object role evidence:",[System.StringComparison]::OrdinalIgnoreCase) -ge 0 -or
                $basis.IndexOf("Generalized artifact role evidence",[System.StringComparison]::OrdinalIgnoreCase) -ge 0 -or
                $basis.IndexOf("Role-aware artifact arbitration:",[System.StringComparison]::OrdinalIgnoreCase) -ge 0
              )
              if ($strongUnresolvedLexical -or $unresolvedFunctionalCandidate -or $unresolvedRoleCandidate -or $highConfidenceResolution) { $count++ }
            }
            return $count
          }

          function Test-RegressionGate($reportPath) {
            if ([string]::IsNullOrWhiteSpace($reportPath)) { throw "Regression gate received an empty report path." }
            if (-not (Test-Path $reportPath)) { throw "Regression report does not exist: $reportPath" }
            $r = Get-Content $reportPath -Raw | ConvertFrom-Json
            if ($r.Failed -ne 0) { return "FAIL" }
            if ($null -eq $expectedCatalog) { return "FAIL" }
            if ($r.Catalog -ne $expectedCatalog -or $r.Processed -ne $expectedCatalog) { return "FAIL" }
            $lexical = if ($null -ne $r.Causes.LEXICAL_CLASSIFIER_DISAGREEMENT) { [int]$r.Causes.LEXICAL_CLASSIFIER_DISAGREEMENT } else { 0 }
            $resolution = if ($null -ne $r.Dispositions.RESOLUTION_CANDIDATE) { [int]$r.Dispositions.RESOLUTION_CANDIDATE } else { 0 }
            $baselineLexical = [int]$baseline.causes.LEXICAL_CLASSIFIER_DISAGREEMENT
            $baselineResolution = [int]$baseline.dispositions.RESOLUTION_CANDIDATE
            $actionable = Get-ActionableConflictCount $r
            Write-Host "BASELINE conflicts=$($baseline.conflicts) lexical=$baselineLexical resolution=$baselineResolution"
            Write-Host "CURRENT  conflicts=$($r.Conflicts) lexical=$lexical resolution=$resolution actionable=$actionable"
            if ($actionable -eq 0) { Write-Host "ACTIONABLE_CONFLICTS=0"; return "PASS" }
            if ($r.Conflicts -eq $baseline.conflicts -and $lexical -eq $baselineLexical) { return "BASELINE" }
            if (($baselineLexical - $lexical) -ge 5 -and $r.Conflicts -le ($baseline.conflicts + 1)) { return "IMPROVEMENT" }
            if ($r.Conflicts -le $baseline.conflicts) { return "PASS" }
            return "FAIL"
          }
          $deterministicRepairAttempted = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $script:CurrentAttempt = $attempt
            Write-CycleStatus "ATTEMPT_START" "attempt=$attempt max=$maxAttempts"
            Write-Host "================ ATTEMPT $attempt / $maxAttempts ================"
            if ($attempt -eq 1) {
              # Never validate a candidate under an already-published version.
              # The candidate version is derived from the repository's current
              # release state; do not hard-code a historical version in the controller.
              $version = Bump-PatchVersion
              Write-Host "INITIAL_VERSION_BUMP=PASS"
            }
            else {
              $version = Bump-PatchVersion
            }
            Write-CycleStatus "BUILD"
            $candidate = Invoke-CandidateBuild
            Write-CycleStatus "INSTALL" "version=$($candidate.Version)"
            $candidate = Install-Candidate $candidate
            Write-Host "APPLICATION=DEFERRED_UNTIL_VALIDATION_PASS"

            # The database is not the source of truth for new test files. Explicitly
            # ingest the populated test folder before forensic analysis, then make the
            # resulting catalog size the expected count for this run.
            Write-CycleStatus "DISCOVER_TEST_ROOT"
            $testLibraryRoot = Find-TestLibraryRoot
            # Build the automation runner explicitly before invoking the scan command.
            # build_windows.bat builds the product, but it does not guarantee that
            # PrintVault.Automation.exe exists in tools/PrintVault.Automation/bin/Release.
            $automationProject = ".\tools\PrintVault.Automation\PrintVault.Automation.csproj"
            & dotnet restore $automationProject
            if ($LASTEXITCODE -ne 0) { throw "Test-library automation restore failed with exit code $LASTEXITCODE." }
            & dotnet build $automationProject -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Test-library automation build failed with exit code $LASTEXITCODE." }
            Write-CycleStatus "INGEST" "root=$testLibraryRoot"
            $scanLog = Join-Path $PWD "build_logs\test-library-scan.log"
            $env:PRINTVAULT_TEST_LIBRARY_ROOT = $testLibraryRoot
            Write-Host "TEST_LIBRARY_ROOT_ENV=$env:PRINTVAULT_TEST_LIBRARY_ROOT"
            $scanExit = Invoke-ExternalWithHeartbeat "dotnet" @("run", "--project", $automationProject, "-c", "Release", "--no-build", "--", "scan", "", "Deep") $scanLog 900
            $scanOutput = if (Test-Path $scanLog) { @(Get-Content $scanLog) } else { @() }
            if ($scanExit -ne 0) { throw "Test-library ingestion failed with exit code $scanExit." }

            # Reconcile legacy taxonomy before diagnostics. This is deliberately a
            # hard gate: moving files alone is insufficient because stale category
            # values/tags can repopulate the UI.
            Write-CycleStatus "LEGACY_TAXONOMY_CLEANUP" "root=$testLibraryRoot"
            $cleanupLog = Join-Path $PWD "build_logs\test-library-cleanup.log"
            $cleanupExit = Invoke-ExternalWithHeartbeat "dotnet" @("run", "--project", $automationProject, "-c", "Release", "--no-build", "--", "cleanup", "") $cleanupLog 900
            Remove-Item Env:PRINTVAULT_TEST_LIBRARY_ROOT -ErrorAction SilentlyContinue
            $cleanupOutput = if (Test-Path $cleanupLog) { @(Get-Content $cleanupLog) } else { @() }
            if ($cleanupExit -ne 0) { throw "Legacy taxonomy cleanup failed with exit code $cleanupExit." }
            foreach ($requiredZero in @(
              "LEGACY_CATEGORIES_REMAINING=0",
              "LEGACY_TAGS_REMAINING=0",
              "LEGACY_FOLDERS_REMAINING=0",
              "LEGACY_REGISTRY_ENTRIES_REMAINING=0"
            )) {
              if (-not ($cleanupOutput -contains $requiredZero)) {
                throw "Legacy taxonomy cleanup verification missing or nonzero: $requiredZero"
              }
            }
            $filesBeforeLine = $cleanupOutput | Where-Object { $_ -match '^FILES_BEFORE=' } | Select-Object -Last 1
            $filesAfterLine = $cleanupOutput | Where-Object { $_ -match '^FILES_AFTER=' } | Select-Object -Last 1
            if (-not $filesBeforeLine -or -not $filesAfterLine) { throw "Legacy taxonomy cleanup did not report file-count preservation." }
            $filesBefore = [int](($filesBeforeLine -split '=',2)[1])
            $filesAfter = [int](($filesAfterLine -split '=',2)[1])
            if ($filesBefore -ne $filesAfter) { throw "Legacy taxonomy cleanup changed file count: before=$filesBefore after=$filesAfter." }
            Write-Host "LEGACY_TAXONOMY_VERIFIED=PASS FILES=$filesAfter"

            $scanCatalogLine = $scanOutput | Where-Object { $_ -match '^SCAN_DISCOVERED=' } | Select-Object -Last 1
            if (-not $scanCatalogLine) { throw "Test-library ingestion did not report SCAN_DISCOVERED." }
            $expectedCatalog = [int](($scanCatalogLine -split '=',2)[1])
            if ($expectedCatalog -lt $baseline.catalog) {
              throw "Test-library catalog regressed below baseline. Expected at least $($baseline.catalog), found $expectedCatalog."
            }
            Write-Host "EXPECTED_CATALOG_AFTER_TEST_INGEST=$expectedCatalog"

            Write-CycleStatus "WHOLE_LIBRARY_DIAGNOSTIC" "two-pass reproducibility gate"
            $report1 = Invoke-WholeLibrary -Pass 1
            $report2 = Invoke-WholeLibrary -Pass 2

            $reportData = Get-Content $report1 -Raw | ConvertFrom-Json
            $reportData2 = Get-Content $report2 -Raw | ConvertFrom-Json
            if ($reportData.Catalog -ne $reportData2.Catalog -or
                $reportData.Processed -ne $reportData2.Processed -or
                $reportData.Conflicts -ne $reportData2.Conflicts -or
                $reportData.Failed -ne $reportData2.Failed) {
              throw "Whole-library reproducibility gate failed: pass1 and pass2 disagree."
            }
            Write-Host "WHOLE_LIBRARY_TWO_PASS=PASS CATALOG=$($reportData.Catalog) PROCESSED=$($reportData.Processed) CONFLICTS=$($reportData.Conflicts)"
            $report = $report2
            $sourceTestFailures = @($script:SourceTestFailures)
            Write-Host "SOURCE_TEST_FAILURE_COUNT=$($sourceTestFailures.Count)"
            $currentFingerprint = Get-SourceFingerprint
            if ($script:SourceModuleLocks.Count -ne 40) {
              throw "Module lock ledger is incomplete: expected 40, found $($script:SourceModuleLocks.Count)."
            }
            foreach ($lock in $script:SourceModuleLocks) {
              if ($lock.Passes -lt 2 -or $lock.Fingerprint -ne $currentFingerprint) {
                throw "Module lock invalid for $($lock.Module)."
              }
            }
            Write-Host "MODULE_LOCK_GATE=PASS COUNT=$($script:SourceModuleLocks.Count) FINGERPRINT=$currentFingerprint"
            if ($sourceTestFailures.Count -gt 0) {
              Write-CycleStatus "SOURCE_TEST_FAILURES_RECORDED" "count=$($sourceTestFailures.Count); whole-library diagnostic completed"
            }
            $remainingConflicts = [int]$reportData.Conflicts
            $actionableConflicts = Get-ActionableConflictCount $reportData
            $needsRepair = $remainingConflicts -gt 0

            # A baseline match is NOT a successful endpoint when conflicts remain.
            # The forensic command is read-only; the actual production fix is the
            # rebuild/writeback pass. Previously this gate exited on a baseline match
            # before deterministic repair could ever run, leaving the library at
            # exactly 424 conflicts indefinitely.
            $gate = Test-RegressionGate $report
            Write-Host "REGRESSION_GATE=$gate"
            if ($gate -eq "BASELINE" -and $needsRepair) {
              Write-Host "BASELINE_WITH_CONFLICTS=CONTINUE_TO_REPAIR"
            }

            # Do not treat a small improvement as the finish line. If the whole-library
            # scan still contains conflicts, feed the forensic report back into the repair
            # engineer and require a fresh build/install/full-library verification.

            if ($needsRepair -and $autoRepair -and $attempt -lt $maxAttempts -and -not $deterministicRepairAttempted) {
              Write-CycleStatus "DETERMINISTIC_REPAIR" "conflicts=$remainingConflicts"
              Write-Host "AUTONOMOUS_REPAIR_TRIGGER=FULL_LIBRARY_REBUILD"
              Write-Host "REMAINING_CONFLICTS=$remainingConflicts"
              & dotnet run --project ".\tools\PrintVault.Automation\PrintVault.Automation.csproj" -c Release --no-build -- repair $report $expectedCatalog
              $repairExit = $LASTEXITCODE
              if ($repairExit -ne 0) { throw "Deterministic full-library repair failed with exit code $repairExit." }
              $deterministicRepairAttempted = $true
              Write-Host "AUTONOMOUS_REPAIR=FULL_LIBRARY_REBUILD_APPLIED"
              continue
            }

            if (($needsRepair -or $sourceTestFailures.Count -gt 0) -and $autoRepair -and $attempt -lt $maxAttempts) {
              Write-CycleStatus "AI_REPAIR" "conflicts=$remainingConflicts"
              Write-Host "AUTONOMOUS_REPAIR_TRIGGER=AI_PATCH"
              Write-Host "REMAINING_CONFLICTS=$remainingConflicts"

              # Defense-in-depth: zero-credit mode must never reach the AI repair boundary,
              # even if a future change accidentally enables $autoRepair in this branch.
              if ($env:PRINTVAULT_ZERO_CREDIT -eq "1") {
                throw "AI repair boundary reached while PRINTVAULT_ZERO_CREDIT=1. Refusing any OpenAI request."
              }
              if ([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY)) {
                throw "OPENAI_API_KEY is required for automatic repair."
              }

              $sourceFailuresPath = Join-Path $PWD "build_logs\source-test-failures.json"
              $repairExit = Invoke-ExternalWithHeartbeat "python" @(".\tools\autonomous_repair.py", $report, $sourceFailuresPath) (Join-Path $PWD "build_logs\autonomous-repair.log") 300
              if ($repairExit -ne 0) { throw "Repair agent failed with exit code $repairExit." }

              $patch = Join-Path $PWD "build_logs\autonomous-repair.patch"
              if (-not (Test-Path $patch)) { throw "Repair patch was not produced." }
              git apply --check $patch
              if ($LASTEXITCODE -ne 0) { throw "Repair patch failed git apply --check." }
              git apply $patch
              if ($LASTEXITCODE -ne 0) { throw "Repair patch failed to apply." }

              if (git diff --name-only | Select-String "^VERSION$") {
                git checkout -- VERSION
              }

              Write-Host "AUTONOMOUS_REPAIR=APPLIED"
              continue
            }

            if ($gate -eq "PASS" -and -not $needsRepair -and $sourceTestFailures.Count -eq 0) {
              # Publish validation proof only after promotion/revalidation so it belongs
              # to the exact SHA that reaches main.
              git fetch origin main --prune
              $currentMainSha = (git rev-parse origin/main).Trim()
              Write-Host "PROMOTION_GUARD_START_SHA=$startingMainSha"
              Write-Host "PROMOTION_GUARD_CURRENT_SHA=$currentMainSha"
              if ($currentMainSha -ne $startingMainSha) { throw "Promotion blocked: origin/main changed during validation." }
              Write-Host "VALIDATION=PASS_NO_CONFLICTS"
              Write-CycleStatus "FINAL_APP_SMOKE" "version=$version"
              $finalApp = Start-FinalApp $candidate $testLibraryRoot
              Close-PrintVault $finalApp
              Write-Host "FINAL_APP_SMOKE_CLOSED=PASS"

              if ($publish) {
                Write-CycleStatus "PUBLISH" "version=$version"
                git add .
                git diff --cached --quiet
                $hasStagedChanges = ($LASTEXITCODE -ne 0)
                if (-not $hasStagedChanges) {
                  Write-Host "PUBLISH_SOURCE=NO_NEW_COMMIT"
                }
                else {
                  git commit -m "${version}: autonomous validated patch"
                  if ($LASTEXITCODE -ne 0) { throw "Validated commit failed." }
                }

                $sourceSha = (git rev-parse HEAD).Trim()
                git push origin "HEAD:refs/heads/$branch"
                if ($LASTEXITCODE -ne 0) { throw "Candidate branch push failed with exit code $LASTEXITCODE." }

                $promoted = $false
                for ($promotionAttempt = 1; $promotionAttempt -le 5; $promotionAttempt++) {
                  Write-Host "PROMOTION_ATTEMPT=$promotionAttempt/5"
                  git fetch origin main --prune
                  $promotionBase = (git rev-parse origin/main).Trim()
                  Write-Host "PROMOTION_BASE_SHA=$promotionBase"

                  $isAncestor = $true
                  git merge-base --is-ancestor $promotionBase HEAD
                  if ($LASTEXITCODE -ne 0) { $isAncestor = $false }

                  if (-not $isAncestor) {
                    Write-Host "PROMOTION_REBASE_REQUIRED=YES"
                    git rebase origin/main
                    if ($LASTEXITCODE -ne 0) {
                      git rebase --abort 2>$null
                      throw "Promotion rebase conflict: main changed with incompatible edits."
                    }

                    Write-Host "PROMOTION_REVALIDATION=FULL"
                    Write-CycleStatus "PROMOTION_REVALIDATION" "attempt=$promotionAttempt base=$promotionBase"
                    $candidate = Invoke-CandidateBuild
                    $candidate = Install-Candidate $candidate
                    $recheckReport = Invoke-WholeLibrary
                    $recheckData = Get-Content $recheckReport -Raw | ConvertFrom-Json
                    $recheckConflicts = [int]$recheckData.Conflicts
                    $recheckGate = Test-RegressionGate $recheckReport
                    Write-Host "PROMOTION_RECHECK_GATE=$recheckGate CONFLICTS=$recheckConflicts"
                    if ($recheckConflicts -ne 0 -or $recheckGate -ne "PASS") {
                      throw "Promotion revalidation failed after main changed: gate=$recheckGate conflicts=$recheckConflicts."
                    }

                    git add .
                    git diff --cached --quiet
                    if ($LASTEXITCODE -ne 0) {
                      git commit -m "${version}: autonomous revalidation after main update"
                      if ($LASTEXITCODE -ne 0) { throw "Promotion revalidation commit failed." }
                    }
                    # Revalidation rebases the candidate branch, so its remote tip may
                    # legitimately be an older candidate from the same run. Replace only
                    # that run-owned branch, and only if its current remote SHA is the one
                    # we just fetched. Never use an unleased force push.
                    git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>$null
                    if ($LASTEXITCODE -eq 0) {
                      $expectedBranchSha = (git rev-parse "refs/remotes/origin/$branch").Trim()
                      git push origin "HEAD:refs/heads/$branch" "--force-with-lease=refs/heads/${branch}:${expectedBranchSha}"
                    } else {
                      git push origin "HEAD:refs/heads/$branch"
                    }
                    if ($LASTEXITCODE -ne 0) { throw "Revalidated candidate branch push failed." }
                    $sourceSha = (git rev-parse HEAD).Trim()
                    git fetch origin main --prune
                    $promotionBase = (git rev-parse origin/main).Trim()
                  }

                  git push origin "HEAD:refs/heads/main" "--force-with-lease=refs/heads/main:$promotionBase"
                  if ($LASTEXITCODE -eq 0) {
                    $promoted = $true
                    break
                  }
                  Write-Warning "Promotion lease lost; another writer moved main. Retrying."
                  Start-Sleep -Seconds 2
                }

                if (-not $promoted) {
                  throw "Promotion failed after 5 lease-protected attempts. No unvalidated force push was performed."
                }

                $sourceSha = (git rev-parse HEAD).Trim()
                Publish-WholeLibraryValidationStatus $sourceSha "two-pass whole-library validation passed on promoted SHA; processed=$($reportData.Processed) conflicts=$($reportData.Conflicts) failures=$($reportData.Failed)"
                powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\tools\publish_release.ps1" -Root "$PWD" -DistributionToken "$env:RELEASE_TOKEN" -Version "$version" -SourceSha "$sourceSha"
                if ($LASTEXITCODE -ne 0) { throw "Production release publication failed with exit code $LASTEXITCODE." }

                Publish-SourceRelease $version $sourceSha $candidate.Installer
                Write-Host "PROMOTED_VERSION=$version"
                $engineeringJobPath = Join-Path $PWD "build_logs\autonomous-engineering-job.json"
                if (Test-Path $engineeringJobPath) {
                  $engineeringJob = Get-Content $engineeringJobPath -Raw | ConvertFrom-Json
                  if ($null -ne $engineeringJob.issue) {
                    $issueHeaders = @{
                      Authorization = "Bearer $env:GITHUB_TOKEN"
                      Accept = "application/vnd.github+json"
                      "X-GitHub-Api-Version" = "2026-03-10"
                      "User-Agent" = "PrintVault-Autonomous-Cycle"
                    }
                    $issueBody = @{ state = "closed"; state_reason = "completed" } | ConvertTo-Json
                    Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/$($engineeringJob.issue)" -Headers $issueHeaders -Method Patch -Body $issueBody -ContentType "application/json" | Out-Null
                    Write-Host "ENGINEERING_ISSUE_CLOSED=PASS ISSUE=$($engineeringJob.issue)"
                  }
                }
                Write-CycleStatus "DONE" "version=$version"
              }
              else {
                Write-Host "PUBLISH=DISABLED"
              }
              exit 0
            }

            # Never publish a candidate while the whole-library scan still reports
            # any conflicts. A low/zero ACTIONABLE count is not a clean library.
            if ($remainingConflicts -gt 0) {
              Write-Host "VALIDATION=CONFLICTS_REMAIN"
              Write-Host "REMAINING_CONFLICTS=$remainingConflicts"
              if (-not $autoRepair -or $attempt -eq $maxAttempts) {
                Write-Host "AUTONOMOUS_REPAIR=EXHAUSTED"
                throw "Validation failed: $remainingConflicts whole-library conflicts remain after $attempt attempt(s). No release will be published."
              }
              continue
            }

            if (-not $autoRepair -or $attempt -eq $maxAttempts) {
              Write-Host "AUTONOMOUS_REPAIR=EXHAUSTED"
              throw "Validation failed: regression gate did not pass cleanly. No release will be published."
            }

            Write-CycleStatus "ATTEMPT_END" "attempt=$attempt"
            throw "Autonomous cycle reached an unexpected state."
          }

          throw "Autonomous cycle exhausted its attempt budget."
      - name: Cleanup PrintVault process
        if: always()
        shell: powershell
        run: |
          Get-Process "PrintVault" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "PRINTVAULT_PROCESS_CLEANUP=PASS"
      - name: Upload autonomous diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: printvault-autonomous-diagnostics-${{ github.run_number }}
          path: build_logs/
          if-no-files-found: warn
          retention-days: 14


