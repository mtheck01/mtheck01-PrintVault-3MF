name: PrintVault Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: printvault-production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Host
          # GitHub's Windows images may already contain Inno Setup. Chocolatey
          # returns a warning/exit path for an already-installed package, so
          # discovery must be independent of the install command's result.
          $paths = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          )
          $iscc = $paths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) {
            throw "Inno Setup compiler was not found on the runner."
          }
          Write-Host "Inno Setup compiler: $iscc"

      - name: Release preflight
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\tools\release_preflight.ps1" -Root "$PWD"

      - name: Static audit
        shell: pwsh
        run: |
          python ".\tools\static_audit.py"

      - name: Contract and source tests
        shell: pwsh
        run: |
          $tests = @(
            ".\tools\test_release_preflight_contract.py",
            ".\tools\test_source_integrity.py",
            ".\tools\test_challenge_version_consistency.py",
            ".\tools\test_xaml_cs_integrity.py",
            ".\tools\test_ui_features.py",
            ".\tools\test_ui_navigation.py",
            ".\tools\test_scan_modes.py",
            ".\tools\test_scan_progress.py",
            ".\tools\test_semantic_evidence_large_scale_fix_9_0_38.py",
            ".\tools\test_semantic_evidence_large_scale_fix_9_0_39.py",
            ".\tools\test_semantic_evidence_large_scale_fix_9_0_40.py"
          )
          foreach ($test in $tests) {
            Write-Host "RUNNING $test"
            python $test
            if ($LASTEXITCODE -ne 0) {
              throw "Test failed: $test"
            }
          }

      - name: Build installer
        shell: cmd
        env:
          PRINTVAULT_CI: '1'
        run: build_windows.bat

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = (Get-Content ".\VERSION" -Raw).Trim()
          $exe = ".\dist\PrintVault\PrintVault.exe"
          $installer = ".\dist\installer\PrintVault_3MF_v$($version)_Setup.exe"

          if (-not (Test-Path $exe)) { throw "Missing application: $exe" }
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }

          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe)).FileVersion
          if ($fileVersion -ne $version) {
            throw "Executable version mismatch. Expected $version, found $fileVersion."
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
          Write-Host "VERSION=$version"
          Write-Host "INSTALLER=$installer"
          Write-Host "SHA256=$hash"



      - name: Determine production release eligibility
        id: release_gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = (Get-Content ".\VERSION" -Raw).Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+
        uses: actions/upload-artifact@v4
        with:
          name: PrintVault-${{ hashFiles('VERSION') }}
          path: |
            dist/installer/*.exe
            dist/PrintVault/PrintVault.exe
            build_logs/build_output.log
            build_logs/version_preflight.log
          if-no-files-found: error
) {
            throw "Invalid VERSION: $version"
          }
          $versionChanged = -not [string]::IsNullOrWhiteSpace((git diff --name-only HEAD^ HEAD -- VERSION))
          if (-not $versionChanged) {
            Write-Host "VERSION=$version has not changed in this commit. CI-only run; no production release."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          Write-Host "VERSION changed to $version. Production release is eligible."
          "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Require distribution token
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.PRINTVAULT_RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TOKEN)) {
            throw "Missing PRINTVAULT_RELEASE_TOKEN. Production release is fail-closed."
          }

      - name: Publish verified production release
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.PRINTVAULT_RELEASE_TOKEN }}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\tools\publish_release.ps1" -Root "$PWD" -DistributionToken "$env:RELEASE_TOKEN" -Version "${{ steps.release_gate.outputs.version }}" -SourceSha "${{ github.sha }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrintVault-${{ hashFiles('VERSION') }}
          path: |
            dist/installer/*.exe
            dist/PrintVault/PrintVault.exe
            build_logs/build_output.log
            build_logs/version_preflight.log
          if-no-files-found: error
