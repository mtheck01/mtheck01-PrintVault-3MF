name: PrintVault Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: printvault-production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Host
          # GitHub's Windows images may already contain Inno Setup. Chocolatey
          # returns a warning/exit path for an already-installed package, so
          # discovery must be independent of the install command's result.
          $paths = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          )
          $iscc = $paths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) {
            throw "Inno Setup compiler was not found on the runner."
          }
          Write-Host "Inno Setup compiler: $iscc"

      - name: Release preflight
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\tools\release_preflight.ps1" -Root "$PWD"

      - name: Static audit
        shell: pwsh
        run: |
          python ".\tools\static_audit.py"

      - name: Test test_release_preflight_contract
        shell: pwsh
        run: python ".\tools\test_release_preflight_contract.py"

      - name: Test language intelligence module contract
        shell: pwsh
        run: python ".\\tools\\test_language_intelligence_module.py"

      - name: Test executable language detection and alias convergence
        shell: pwsh
        run: python ".\\tools\\test_language_detection_challenge.py"

      - name: Test test_source_integrity
        shell: pwsh
        run: python ".\tools\test_source_integrity.py"

      - name: Test test_challenge_version_consistency
        shell: pwsh
        run: python ".\tools\test_challenge_version_consistency.py"

      - name: Test test_xaml_cs_integrity
        shell: pwsh
        run: python ".\tools\test_xaml_cs_integrity.py"

      - name: Test test_ui_features
        shell: pwsh
        run: python ".\tools\test_ui_features.py"

      - name: Test test_ui_navigation
        shell: pwsh
        run: python ".\tools\test_ui_navigation.py"

      - name: Test test_scan_modes
        shell: pwsh
        run: python ".\tools\test_scan_modes.py"

      - name: Test test_scan_progress
        shell: pwsh
        run: python ".\tools\test_scan_progress.py"

      - name: Test test_semantic_evidence_large_scale_fix_9_0_38
        shell: pwsh
        run: python ".\tools\test_semantic_evidence_large_scale_fix_9_0_38.py"

      - name: Test test_semantic_evidence_large_scale_fix_9_0_39
        shell: pwsh
        run: python ".\tools\test_semantic_evidence_large_scale_fix_9_0_39.py"

      - name: Test test_semantic_evidence_large_scale_fix_9_0_40
        shell: pwsh
        run: python ".\tools\test_semantic_evidence_large_scale_fix_9_0_40.py"

      - name: Test test_semantic_evidence_arbitration_9_0_42
        shell: pwsh
        run: python ".\tools\test_semantic_evidence_arbitration_9_0_42.py"

      - name: Test test_semantic_evidence_architecture_9_0_43
        shell: pwsh
        run: python ".\tools\test_semantic_evidence_architecture_9_0_43.py"

      - name: Test test_semantic_evidence_dimensional_arbitration_9_0_44
        shell: pwsh
        run: python ".\tools\test_semantic_evidence_dimensional_arbitration_9_0_44.py"

      - name: Test test_semantic_evidence_artifact_role_precision_9_0_45
        shell: pwsh
        run: python ".\\tools\\test_semantic_evidence_artifact_role_precision_9_0_45.py"

      - name: Test test_semantic_evidence_unresolved_category_gate_9_0_46
        shell: pwsh
        run: python ".\\tools\\test_semantic_evidence_unresolved_category_gate_9_0_46.py"
      - name: Test CamelCase semantic recovery 9.0.47
        shell: pwsh
        run: python ".\tools\test_semantic_camelcase_recovery_9_0_47.py"
      - name: Test forensic version classification
        shell: pwsh
        run: python ".\\tools\\test_forensic_version_classification.py"

      - name: Test whole-library diagnostic accounting
        shell: pwsh
        run: python ".\\tools\\test_whole_library_diagnostic_accounting.py"

      - name: Test category registry persistence behavior
        shell: pwsh
        run: dotnet run --project ".\\tools\\PrintVault.Automation\\PrintVault.Automation.csproj" --configuration Release -- selftest-category-registry

      - name: Test whole-library repair report contract
        shell: pwsh
        run: dotnet run --project ".\\tools\\PrintVault.Automation\\PrintVault.Automation.csproj" --configuration Release -- selftest-repair-report-contract

      - name: Test autonomous cycle contract
        shell: pwsh
        run: python ".\\tools\\test_autonomous_cycle_contract.py"

      - name: Build installer
        shell: cmd
        env:
          PRINTVAULT_CI: '1'
        run: build_windows.bat

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = (Get-Content ".\VERSION" -Raw).Trim()
          $exe = ".\dist\PrintVault\PrintVault.exe"
          $installer = ".\dist\installer\PrintVault_3MF_v$($version)_Setup.exe"

          if (-not (Test-Path $exe)) { throw "Missing application: $exe" }
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }

          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe)).FileVersion
          if ($fileVersion -ne $version) {
            throw "Executable version mismatch. Expected $version, found $fileVersion."
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
          Write-Host "VERSION=$version"
          Write-Host "INSTALLER=$installer"
          Write-Host "SHA256=$hash"

      - name: Install and launch on isolated admin runner
        shell: pwsh
        timeout-minutes: 10
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "Installer smoke requires an administrator token; runner identity is $($identity.Name)."
          }
          Write-Host "INSTALL_SMOKE_ADMIN=PASS IDENTITY=$($identity.Name)"

          $version = (Get-Content ".\VERSION" -Raw).Trim()
          $installer = (Resolve-Path ".\dist\installer\PrintVault_3MF_v$($version)_Setup.exe").Path
          $installerLog = Join-Path $env:RUNNER_TEMP "PrintVault-installer-smoke.log"
          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=$installerLog"
          ) -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $installerLog) { Get-Content -LiteralPath $installerLog }
            throw "Installer exited with code $($install.ExitCode). Log: $installerLog"
          }

          $installedExe = Join-Path $env:ProgramFiles "PrintVault 3MF\PrintVault.exe"
          if (-not (Test-Path -LiteralPath $installedExe)) {
            throw "Installer reported success but installed executable is missing: $installedExe"
          }
          $installedVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installedExe).FileVersion
          if ($installedVersion -ne $version) {
            throw "Installed executable version mismatch. Expected $version, found $installedVersion."
          }
          Write-Host "INSTALL_SMOKE_INSTALL=PASS VERSION=$installedVersion"

          # The runner VM is disposable. Point the app at an empty folder under
          # RUNNER_TEMP so startup cannot scan the user's actual print library.
          $testLibrary = Join-Path $env:RUNNER_TEMP "PrintVault-Isolated-Test-Library"
          New-Item -ItemType Directory -Force -Path $testLibrary | Out-Null
          $rootFile = Join-Path $env:APPDATA "PrintVault\root.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $rootFile) | Out-Null
          Set-Content -LiteralPath $rootFile -Value $testLibrary -NoNewline
          Write-Host "INSTALL_SMOKE_LIBRARY_ROOT=$testLibrary"

          $app = $null
          try {
            $app = Start-Process -FilePath $installedExe -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $ready = $false
            do {
              $app.Refresh()
              if ($app.HasExited) { throw "Installed app exited during startup with code $($app.ExitCode)." }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) {
                try { $ready = $app.Responding } catch { $ready = $false }
                if ($ready) { break }
              }
              Start-Sleep -Milliseconds 500
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not $ready) {
              throw "Installed app did not expose a responsive main window within 30 seconds. PID=$($app.Id)"
            }
            Write-Host "INSTALL_SMOKE_WINDOW=PASS PID=$($app.Id) HANDLE=$($app.MainWindowHandle.ToInt64())"
          }
          finally {
            if ($null -ne $app -and -not $app.HasExited) {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            }
            Write-Host "INSTALL_SMOKE_APP_CLEANUP=COMPLETE"
          }




      - name: Determine production release eligibility
        id: release_gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = (Get-Content ".\VERSION" -Raw).Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid VERSION: $version"
          }

          $manifestUrl = "https://raw.githubusercontent.com/mtheck01/PrintVault-Updates/main/manifest.json"
          $currentManifest = Invoke-RestMethod -Uri $manifestUrl -Method Get
          if ($currentManifest.version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Published RemotePatch manifest has an invalid version: $($currentManifest.version)"
          }

          if ([version]$currentManifest.version -gt [version]$version) {
            throw "Source VERSION $version is behind the published RemotePatch manifest $($currentManifest.version). Refusing release."
          }

          if ([version]$currentManifest.version -eq [version]$version) {
            Write-Host "RemotePatch manifest already matches VERSION=$version. CI-only run; no production release."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          Write-Host "RemotePatch manifest $($currentManifest.version) is behind VERSION=$version. Production release is eligible."
          "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Require distribution token
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.PRINTVAULT_RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TOKEN)) {
            throw "Missing PRINTVAULT_RELEASE_TOKEN. Production release is fail-closed."
          }

      # Autonomous validation is triggered by the main push event when available,
      # with its scheduled zero-credit watchdog as the fallback for API-created commits.
      # Do not dispatch a second autonomous cycle from this workflow; duplicate runs
      # would race the single-cycle concurrency lease.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrintVault-${{ hashFiles('VERSION') }}-diagnostics
          path: |
            dist/installer/*.exe
            dist/PrintVault/PrintVault.exe
            build_logs/build_output.log
            build_logs/version_preflight.log
          if-no-files-found: error
