name: PrintVault Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_REPO: mtheck01/PrintVault-Updates

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Host
          # GitHub's Windows images may already contain Inno Setup. Chocolatey
          # can report an already-installed package, so discovery must be
          # independent of the install command's result.
          $paths = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          )
          $iscc = $paths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) {
            throw "Inno Setup compiler was not found on the runner."
          }
          Write-Host "Inno Setup compiler: $iscc"

      - name: Validate tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content ".\VERSION" -Raw).Trim()
          $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
          if ($tag -ne $version) {
            throw "Tag/version mismatch. Tag=$tag VERSION=$version"
          }

      - name: Release preflight
        shell: pwsh
        run: |
          $tagVersion = "$env:GITHUB_REF_NAME".TrimStart("v")
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\tools\release_preflight.ps1" -Root "$PWD" -ExpectedVersion "$tagVersion"
          if ($LASTEXITCODE -ne 0) { throw "Release preflight failed for $tagVersion." }

      - name: Static audit
        shell: pwsh
        run: python ".\tools\static_audit.py"

      - name: Contract and source tests
        shell: pwsh
        run: |
          $tests = @(
            ".\tools\test_release_preflight_contract.py",
            ".\tools\test_source_integrity.py",
            ".\tools\test_challenge_version_consistency.py",
            ".\tools\test_xaml_cs_integrity.py",
            ".\tools\test_ui_features.py",
            ".\tools\test_ui_navigation.py",
            ".\tools\test_scan_modes.py",
            ".\tools\test_scan_progress.py"
          )
          foreach ($test in $tests) {
            Write-Host "RUNNING $test"
            python $test
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $test" }
          }

      - name: Build installer
        shell: cmd
        env:
          PRINTVAULT_CI: '1'
        run: build_windows.bat

      - name: Package RemotePatch ZIP
        shell: pwsh
        run: |
          $version = (Get-Content ".\VERSION" -Raw).Trim()
          $packageRoot = Join-Path $PWD ("PrintVault_3MF_v" + $version + "_PATCH")
          $zip = Join-Path $PWD ("PrintVault_3MF_v" + $version + "_PATCH.zip")

          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue

          $installer = Join-Path $PWD ("dist\installer\PrintVault_3MF_v" + $version + "_Setup.exe")
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer artifact missing: $installer"
          }

          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot "dist\installer") | Out-Null
          Copy-Item -LiteralPath $installer -Destination (Join-Path $packageRoot ("dist\installer\PrintVault_3MF_v" + $version + "_Setup.exe")) -Force
          Compress-Archive -LiteralPath $packageRoot -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash

          $extractRoot = Join-Path $PWD "_release_verify"
          Remove-Item -LiteralPath $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $extractRoot -Force
          $expectedRelative = "PrintVault_3MF_v" + $version + "_PATCH/dist/installer/PrintVault_3MF_v" + $version + "_Setup.exe"
          $extractedInstaller = Join-Path $extractRoot $expectedRelative
          if (-not (Test-Path -LiteralPath $extractedInstaller -PathType Leaf)) {
            throw "RemotePatch ZIP structure invalid. Expected: $expectedRelative"
          }

          Write-Host "VERSION=$version"
          Write-Host "ZIP=$zip"
          Write-Host "SHA256=$hash"
          Write-Host "ZIP STRUCTURE=PASS"

      - name: Require distribution token
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.PRINTVAULT_RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TOKEN)) {
            throw "Missing PRINTVAULT_RELEASE_TOKEN repository secret."
          }

      - name: Publish distribution release
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.PRINTVAULT_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: PrintVault 3MF ${{ github.ref_name }}
          body: |
            Automated PrintVault 3MF release generated from the version-controlled source repository.

            The release ZIP is SHA-256 verified before publication and is compatible with the PrintVault Remote Patch Agent.
          files: PrintVault_3MF_v*_PATCH.zip
          fail_on_unmatched_files: true

      - name: Update RemotePatch manifest
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.PRINTVAULT_RELEASE_TOKEN }}
        run: |
          $version = (Get-Content ".\VERSION" -Raw).Trim()
          $zip = "PrintVault_3MF_v" + $version + "_PATCH.zip"
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $PWD $zip)).Hash
          $manifestPath = "manifest.json"
          $api = "https://api.github.com/repos/" + $env:RELEASE_REPO + "/contents/" + $manifestPath
          $headers = @{
            Authorization = "Bearer " + $env:RELEASE_TOKEN
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2026-03-10"
            "User-Agent" = "PrintVault-Release-Automation"
          }

          $current = Invoke-RestMethod -Uri $api -Headers $headers -Method Get
          $releaseUrl = "https://github.com/" + $env:RELEASE_REPO + "/releases/download/v" + $version + "/" + $zip

          $manifest = [ordered]@{
            version = $version
            packageUrl = $releaseUrl
            sha256 = $sha
            installerRelativePath = "PrintVault_3MF_v" + $version + "_PATCH/dist/installer/PrintVault_3MF_v" + $version + "_Setup.exe"
            installerArguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"
          }

          $json = $manifest | ConvertTo-Json -Depth 5
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json + [Environment]::NewLine)
          $base64 = [Convert]::ToBase64String($bytes)

          $body = @{
            message = "Update RemotePatch manifest to " + $version
            content = $base64
            sha = $current.sha
            branch = "main"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri $api -Headers $headers -Method Put -Body $body -ContentType "application/json"

          Write-Host "Published manifest for $version"
          Write-Host "Package URL: $releaseUrl"
          Write-Host "SHA256: $sha"

      - name: Verify published release and manifest
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.PRINTVAULT_RELEASE_TOKEN }}
        run: |
          $version = (Get-Content ".\\VERSION" -Raw).Trim()
          $zip = "PrintVault_3MF_v" + $version + "_PATCH.zip"
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $PWD $zip)).Hash
          $releaseUrl = "https://github.com/" + $env:RELEASE_REPO + "/releases/download/v" + $version + "/" + $zip
          $releaseApi = "https://api.github.com/repos/" + $env:RELEASE_REPO + "/releases/tags/v" + $version
          $manifestApi = "https://api.github.com/repos/" + $env:RELEASE_REPO + "/contents/manifest.json?ref=main"
          $headers = @{
            Authorization = "Bearer " + $env:RELEASE_TOKEN
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2026-03-10"
            "User-Agent" = "PrintVault-Release-Automation"
          }

          $release = Invoke-RestMethod -Uri $releaseApi -Headers $headers -Method Get
          if ($release.tag_name -ne ("v" + $version)) {
            throw "Published release tag mismatch. Expected v$version, found $($release.tag_name)"
          }

          $assetName = "PrintVault_3MF_v" + $version + "_PATCH.zip"
          $asset = @($release.assets | Where-Object { $_.name -eq $assetName })
          if ($asset.Count -ne 1) {
            throw "Expected exactly one published release asset named $assetName; found $($asset.Count)."
          }

          $manifestResponse = Invoke-RestMethod -Uri $manifestApi -Headers $headers -Method Get
          $manifestJson = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($manifestResponse.content -replace '\s','')))
          $publishedManifest = $manifestJson | ConvertFrom-Json

          if ($publishedManifest.version -ne $version) { throw "Manifest version mismatch." }
          if ($publishedManifest.sha256 -ne $sha) { throw "Manifest SHA-256 mismatch." }
          if ($publishedManifest.packageUrl -ne $releaseUrl) { throw "Manifest packageUrl mismatch." }
          if ($publishedManifest.installerRelativePath -ne ("PrintVault_3MF_v" + $version + "_PATCH/dist/installer/PrintVault_3MF_v" + $version + "_Setup.exe")) {
            throw "Manifest installerRelativePath mismatch."
          }

          Write-Host "PUBLISHED RELEASE=PASS"
          Write-Host "MANIFEST VERIFICATION=PASS"

